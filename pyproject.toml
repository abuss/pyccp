[build-system]
requires = ["maturin>=1.5,<2.0"]
build-backend = "maturin"

[project]
name = "pyccp"
version = "2.1.0"
requires-python = ">=3.11"
dependencies = [
    "pytest>=9.1.1",
]

[tool.maturin]
module-name = "pyccp_core"
manifest-path = "rust/Cargo.toml"
features = ["pyo3/extension-module"]

[dependency-groups]
dev = [
    "maturin>=1.15.0",
]
